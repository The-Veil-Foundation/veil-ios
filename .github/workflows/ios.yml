name: iOS

# Manual only. The job builds XrayCore with gomobile (15-20 minutes) and then
# two app targets. Run it from the Actions tab when the sources change.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: XrayBridge/go.sum

      # Xray-core compiled for iOS with gomobile. This is the app's only
      # native dependency — no tun2socks, no sing-box.
      - name: Cache XrayCore.xcframework
        id: framework-cache
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: xraycore-${{ runner.os }}-${{ hashFiles('XrayBridge/go.sum', 'XrayBridge/xray.go') }}

      - name: Build XrayCore.xcframework
        if: steps.framework-cache.outputs.cache-hit != 'true'
        run: Scripts/build-xraycore.sh

      # Both targets compile Models/ and Core/ from the macos submodule, so
      # run the Mac package's tests against the pinned revision too.
      - name: Fetch desktop core binaries
        working-directory: macos
        run: |
          Scripts/fetch-xray.sh
          Scripts/fetch-singbox.sh
          Scripts/fetch-tun2socks.sh

      - name: Test shared code
        working-directory: macos
        run: swift test

      - name: Build for simulator
        run: Scripts/build-app.sh simulator Release

      - name: Build for device (unsigned)
        run: Scripts/build-app.sh device Release
